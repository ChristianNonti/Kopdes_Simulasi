*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:900px;margin:0 auto;padding:10px}
#hud{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;font-size:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:6px}
#repbar{width:80px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
#repfill{height:100%;background:var(--ac);width:50%}
#wrap{position:relative;line-height:0}
#wrap canvas{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);touch-action:none}
#ov{position:absolute;inset:0;background:rgba(0,0,0,.62);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:12px;gap:10px;line-height:1.4}
#ov h2{margin:0;font-size:24px}#ov p{margin:0;max-width:440px;font-size:14px}
button{font:inherit;cursor:pointer}
#go{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 22px;font-weight:600;font-size:16px}
#msg{min-height:22px;margin:8px 2px;font-size:14px}
#pad{display:none;justify-content:space-between;align-items:center;margin-top:6px;user-select:none;-webkit-user-select:none}
@media (pointer:coarse),(max-width:700px){#pad{display:flex}}
#dp{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
#dp button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;font-size:22px;touch-action:none}
#act{width:96px;height:96px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:18px;font-weight:700;touch-action:none}
#up{display:flex;flex-direction:column;gap:6px;width:100%;max-width:360px}.ub{background:#fff;color:#222;border:0;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}.ub:disabled{opacity:.45;cursor:default}
.hint{font-size:12px;opacity:.7;margin:4px 2px}
</style>
</head>

function turn(o,t,dt){let d=t-o.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));o.rotation.y+=d*Math.min(1,dt*10)}
const P=mkChar(0x2f7d4f,0xf1c27d,0x222222,{style:5,bag:false});
bx(.66,.5,.03,0xffffff,0,1.0,.27,P.top);bx(.4,.3,.03,0xffffff,0,1.45,.25,P.top);bx(.16,.09,.03,0xf5c542,.14,1.5,.27,P.top);sc.add(P);
/* suara */
let AC=null,mute=false;
function snd(f,d,t,v){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.08,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
const SFX={ok:()=>{snd(660,.12);setTimeout(()=>snd(880,.2),110)},bad:()=>snd(160,.3,'sawtooth'),pick:()=>snd(520,.08,'square',.05),take:()=>snd(400,.1),bye:()=>snd(220,.4,'triangle'),door:()=>snd(300,.15,'triangle',.05)};
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?'🔇':'🔊'};
const wl=c=>c.want.map(i=>i.e).join('');
/* game */
const EV=[{n:'Hari Biasa',e:'🌤️',d:'Hari normal.',sp:1,pay:1,pa:1,sk:0xcfe3ef},{n:'Jam Sibuk',e:'🚦',d:'Pelanggan lebih sering, bayar 1,5x!',sp:.6,pay:1.5,pa:1,sk:0xf3d9b1},{n:'Hari Pasar',e:'🛍️',d:'Ramai, pelanggan lebih sabar.',sp:.75,pay:1,pa:1.3,sk:0xd6ecc4},{n:'Hujan Deras',e:'🌧️',d:'Sepi, tapi bayar 1,2x.',sp:1.5,pay:1.2,pa:.9,sk:0x8d9aa6}];const target=d=>30000+d*10000;
let S,keys={},st='menu',last=0,best=0;try{best=+localStorage.getItem('kopdesBest')||0}catch(e){}
function clearC(){if(S){S.cs.forEach(c=>{sc.remove(c.g);sc.remove(c.bar)});setCarry([])}}
function reset(){clearC();S={day:1,money:0,rep:50,combo:0,u:{h:0,s:0,p:0,k:0},dayMoney:0,t:60,spawn:1,cs:[],p:{x:0,z:-1.6,c:[],m:[]},served:0,lost:0,msg:'',msgT:0,evd:EV[0],tg:target(1)};setCarry(null)}
function setCarry(a){const p=S.p;p.m.forEach(m=>P.remove(m));p.m=[];p.c=a||[];p.c.forEach((it,i)=>{const m=mkItem(it.k);m.scale.setScalar(.8);m.position.set((i-(p.c.length-1)/2)*.45,1.3,.75);P.add(m);p.m.push(m)})}
function say(m){S.msg=m;S.msgT=3}
function setB(c,t){const m=tex(t,false);c.bub.material.map=m;c.bub.scale.x=1.2*m.image.width/128}
function mkBar(){const b=new T.Group();b.add(new T.Mesh(new T.PlaneGeometry(1.1,.16),new T.MeshBasicMaterial({color:0x222222})));
 const f=new T.Mesh(new T.PlaneGeometry(1,.1),new T.MeshBasicMaterial({color:0x4caf50}));f.position.z=.01;b.add(f);b.f=f;sc.add(b);return b}
function spawnC(){const vip=S.day>=2&&Math.random()<.18,n=S.day<3?1:S.day<5?1+(Math.random()<.5?1:0):1+Math.floor(Math.random()*3),w=[...ITEMS].sort(()=>Math.random()-.5).slice(0,n).sort((a,b)=>a.x-b.x),mx=Math.max(7,14-S.day*.8)*(1+.15*S.u.p)*(vip?.75:1)*S.evd.pa,g=mkChar(vip?0xffd700:pick(SHIRTS),pick(SKINS),pick(HAIRS),{vip}),sx=pick([-9,-6,-3,0,3,6,9].filter(x=>!S.cs.some(c=>c.s!='leave'&&c.sx==x))),sd=sx<0?-13:13,zq=-7.2+(Math.random()-.5)*.8;
 g.position.set(-23.5,0,3.4);g.rotation.y=Math.PI/2;const b=spr('🛒',false,1.2,1.2);b.position.y=3;g.add(b);sc.add(g);SFX.door();
 const path=[[-13,3.4],[-13,zq],...w.map(it=>[it.x,zq,it]),[sd,zq],[sd,3.4],[sx,3.4]];
 S.cs.push({g,bar:mkBar(),bub:b,s:'walk',sx,want:w,hold:[],hm:[],path,tot:w.reduce((a,i)=>a+i.p,0)*(vip?2:1),vip,pat:mx,max:mx})}
function pay(c){const r=c.pat/c.max,cb=Math.min(S.combo,5)*500,gain=Math.round((c.tot*(1+.1*S.u.h)+(r>.5?2000:0)+cb)*S.evd.pay/500)*500;S.combo++;S.money+=gain;S.dayMoney+=gain;S.served++;S.rep=Math.min(100,S.rep+(r>.5?3:1));leave(c,'😄');SFX.ok();say('Pembayaran diterima! +Rp'+rp(gain)+(cb?' (kombo 🔥 +'+rp(cb)+')':''))}
function leave(c,e){c.s='leave';setB(c,e);c.bub.visible=true}
function update(dt){
 const p=S.p;let dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.down?1:0)-(keys.up?1:0);const mv=dx||dz;
 if(mv){const l=Math.hypot(dx,dz);const ax=dx/l*6*dt,az=dz/l*6*dt,nx=clamp(p.x+ax,-20.8,20.8),nz=clamp(p.z+az,-8.1,13.2);if(!blocked(nx,p.z))p.x=nx;if(!blocked(p.x,nz))p.z=nz;turn(P,Math.atan2(dx,dz),dt)}
 P.position.set(p.x,0,p.z);anim(P,mv,dt);
 S.t-=dt;
 if(S.t>0){S.spawn-=dt;if(S.spawn<=0){if(S.cs.filter(c=>c.s!='leave').length<6)spawnC();S.spawn=Math.max(2.5,7-S.day*.6)*(.7+Math.random()*.6)*S.evd.sp}}
 let i=0;
 for(const c of S.cs){
  let tx,tz;if(c.s=='leave'){tx=-23.5;tz=3.4}else if(c.path&&c.path.length){tx=c.path[0][0];tz=c.path[0][1]}else{tx=c.sx;tz=2.2}
  const ex=tx-c.g.position.x,ez=tz-c.g.position.z,d=Math.hypot(ex,ez),m=d>.02;
  if(m){const s=Math.min(d,3.2*(1+.25*S.u.s)*dt);c.g.position.x+=ex/d*s;c.g.position.z+=ez/d*s;turn(c.g,Math.atan2(ex,ez),dt)}
  else if(c.s=='walk'){
   if(c.path.length){const w=c.path[0];if(w[2]){c.pt=(c.pt||0)+dt;turn(c.g,Math.PI,dt);if(c.pt>.8){c.pt=0;c.path.shift();c.hold.push(w[2]);const q=mkItem(w[2].k);q.scale.setScalar(.8);c.g.add(q);c.hm.push(q);c.g.carry=c.hm.length;c.hm.forEach((o,k)=>o.position.set((k-(c.hm.length-1)/2)*.45,1.3,.75))}}else c.path.shift()}
   else{c.s='wait';setB(c,c.vip?'👑🧾':'🧾')}}
  else turn(c.g,Math.PI,dt);
  anim(c.g,m,dt);
  if(c.s=='wait'&&S.u.k){c.aw=(c.aw||0)+dt;if(c.aw>3.2-S.u.k*.9)pay(c)}
  const a=c.s=='wait';
  if(a){c.pat-=dt;if(c.pat<=0){leave(c,'😠');SFX.bye();S.rep-=8;S.lost++;S.combo=0;say('Pelanggan pergi karena menunggu terlalu lama! Reputasi -8')}}
  c.bar.visible=a;
  if(a){const r=Math.max(0,c.pat/c.max);c.bar.position.set(c.g.position.x,2.55,c.g.position.z);c.bar.quaternion.copy(cam.quaternion);
   c.bar.f.scale.x=Math.max(.001,r);c.bar.f.position.x=-(1-r)*.5;c.bar.f.material.color.set(r>.5?0x4caf50:r>.25?0xffb300:0xe53935)}
 }
 S.cs=S.cs.filter(c=>{if(c.s=='leave'&&c.g.position.x<-23){sc.remove(c.g);sc.remove(c.bar);return false}return true});
 if(S.msgT>0)S.msgT-=dt;
 S.rep=Math.min(100,S.rep);
 if(S.rep<=0){S.rep=0;st='over';showOv()}else if(S.t<=0){S.t=0;st='summary';S.hit=S.dayMoney>=S.tg;if(S.hit){S.money+=15000;S.rep=Math.min(100,S.rep+5)}showOv()}
}
function act(){
 if(st!='play')return;
 const p=S.p;let near=null,nd=2.2;
 for(const c of S.cs)if(c.s=='wait'){const d=Math.abs(c.g.position.x-p.x);if(d<nd&&Math.abs(c.g.position.z-p.z)<5.5){nd=d;near=c}}
 if(near)pay(near);else say('Belum ada pelanggan siap bayar (🧾) di dekatmu. Geser ke samping!')}
function showOv(){
 const o=$('ov');o.style.display='flex';let h='';
 if(st!='menu'&&S.day>best){best=S.day;try{localStorage.setItem('kopdesBest',best)}catch(e){}}
 if(st=='menu')h='<h2>🏪 Kopdes Simulasi 3D</h2><p>Kamu kasir Koperasi Desa. Pelanggan masuk, mengambil barang sendiri di rak belakang, lalu mengantre di depan meja. Geser ke pelanggan yang membawa 🧾 dan terima pembayarannya sebelum kesabaran mereka habis!</p><button id="go">Mulai Bermain</button>'+(best?'<p>🏆 Rekor: bertahan sampai hari '+best+'</p>':'');
 else if(st=='summary'){const U=[['h','💳 Mesin EDC (+10% bayaran)',3,45000],['s','🛒 Rak Rapi (pelanggan belanja lebih cepat)',3,30000],['p','🤝 Ramah Tamah (+15% sabar)',3,50000],['k','🧾 Kasir Pembantu (terima bayaran otomatis)',3,60000]];
  h='<h2>📅 Hari '+S.day+' selesai</h2><p>Pendapatan hari ini: Rp'+rp(S.dayMoney)+'<br>Kas: Rp'+rp(S.money)+'<br>Terlayani: '+S.served+' · Pergi: '+S.lost+'<br>Reputasi: '+Math.round(S.rep)+'<br>🎯 Target Rp'+rp(S.tg)+': '+(S.hit?'✅ Tercapai! Bonus Rp15.000 & ⭐+5':'❌ belum tercapai')+'</p><div id="up">'+U.map(([k,n,mx,c])=>{const l=S.u[k],cost=c*(l+1);return l>=mx?'<button class="ub" disabled>'+n+' · MAKS</button>':'<button class="ub" data-k="'+k+'" data-c="'+cost+'"'+(S.money<cost?' disabled':'')+'>'+n+' · Lv'+l+' · Rp'+rp(cost)+'</button>'}).join('')+'</div><button id="go">Lanjut ke Hari '+(S.day+1)+'</button>'}
 else h='<h2>😞 Kopdes Tutup</h2><p>Reputasi habis. Kamu bertahan sampai hari '+S.day+' dengan total pendapatan Rp'+rp(S.money)+'.</p><button id="go">Main Lagi</button>';
 o.innerHTML=h;o.querySelectorAll('.ub[data-k]').forEach(b=>b.onclick=()=>{S.money-=+b.dataset.c;S.u[b.dataset.k]++;SFX.ok();showOv()});
 $('go').onclick=()=>{
  if(st=='menu'||st=='over')reset();
  else{clearC();S.day++;S.t=60;S.dayMoney=0;S.served=0;S.lost=0;S.cs=[];S.spawn=1;S.evd=pick(EV);S.tg=target(S.day);setCarry(null);say(S.evd.e+' '+S.evd.n+'! '+S.evd.d)}
  st='play';o.style.display='none'};
}
/* input */
const map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{if(map[e.code]){keys[map[e.code]]=true;e.preventDefault()}else if((e.code=='KeyE'||e.code=='Space')&&!e.repeat){e.preventDefault();act()}});
addEventListener('keyup',e=>{if(map[e.code])keys[map[e.code]]=false});
document.querySelectorAll('#dp button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
$('act').addEventListener('pointerdown',e=>{e.preventDefault();act()});
/* render */
let asp=1.6;
function resize(){const w=$('wrap').clientWidth||600,h=Math.round(w*(w<600?.95:.68));R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.setSize(w,h,false);asp=w/h;cam.aspect=asp;cam.updateProjectionMatrix()}
addEventListener('resize',resize);
function loop(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(st=='play')update(dt);
 const f=Math.max(1,1.7/asp)*1.45,cx=S.p.x*.55;
 cam.position.set(cx,15*f,15*f);cam.lookAt(cx,0,1.8*f);
 $('msg').textContent=S.msgT>0?S.msg:(st=='play'?'Ayo layani pelanggan!':'');
 $('hd').textContent=S.day;$('hc').textContent=S.combo;$('hg').textContent='🎯 Rp'+rp(S.dayMoney)+' / '+rp(S.tg);$('he').textContent=S.evd.e+' '+S.evd.n;sc.background.setHex(S.evd.sk);$('ht').textContent=Math.ceil(S.t);$('hm').textContent=rp(S.money);$('hr').textContent=Math.round(S.rep);$('repfill').style.width=S.rep+'%';
 R.render(sc,cam);requestAnimationFrame(loop);
}
reset();resize();showOv();requestAnimationFrame(loop);
</script>
</body>
</html>
