$('ov').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b&&!b.classList.contains('ub'))buyStock(b.dataset.k,+b.dataset.n)});
function rer(){const o=$('ov'),y=o.scrollTop;showOv();o.scrollTop=y}
const SHC=[25000,40000,60000,80000,100000];
function shelfBtn(){if(S.shelves>=ITEMS.length)return '<button class="ub" disabled>🧱 Tambah Rak · MAKS ('+ITEMS.length+' rak)</button>';const nx=ITEMS[S.shelves],cost=SHC[S.shelves-3];
 return '<button class="ub" data-sh="1" data-c="'+cost+'"'+(S.money<cost?' disabled':'')+'>🧱 Tambah Rak '+nx.e+' '+nx.k+' (rak '+(S.shelves+1)+'/'+ITEMS.length+') · Rp'+rp(cost)+'</button>'}
/* kasir: masukkan uang sesuai total barang */
const DEN=[1000,2000,5000,10000,20000,50000];
function closeReg(){if(S)S.reg=null;$('reg').hidden=true}
function openReg(c){S.reg=c;S.ent=0;$('reg').hidden=false;drawReg();SFX.pick()}
function drawReg(){const c=S.reg;if(!c)return;const v=c.vip?2:1;
 $('reg').innerHTML='<div class="rg-t">💳 Kasir'+(c.vip?' · 👑 VIP (harga 2x)':'')+'</div><div class="rg-l">'+c.hold.map(it=>'<div><span>'+it.e+' '+it.k+'</span><span>Rp'+rp(it.p*v)+'</span></div>').join('')+'</div><div class="rg-d">Uang dimasukkan: <b>Rp'+rp(S.ent)+'</b></div><div class="rg-k">'+DEN.map((d,i)=>'<button data-d="'+d+'">'+(i+1)+' · Rp'+rp(d)+'</button>').join('')+'</div><div class="rg-a"><button data-a="clr">Hapus</button><button data-a="cls">Tutup</button><button data-a="ok">✔ Bayar</button></div><div class="rg-h">Jumlahkan harga barang, lalu masukkan uang yang pas. Tombol 1–6 · Enter = bayar · Backspace = hapus · Esc = tutup</div>'}
function regAdd(d){if(!S.reg)return;S.ent=Math.min(500000,S.ent+d);SFX.take();drawReg()}
function regClr(){if(!S.reg)return;S.ent=0;drawReg()}
function regOk(){const c=S.reg;if(!c)return;
 if(c.s!='wait'){closeReg();return}
 if(S.ent==c.tot){closeReg();pay(c)}
 else{const k=S.ent<c.tot;S.rep=Math.max(0,S.rep-2);S.combo=0;S.ent=0;SFX.bad();say(k?'Uang kurang! Hitung lagi total barangnya. Reputasi -2':'Uang kelebihan! Masukkan jumlah yang pas. Reputasi -2');drawReg()}}
$('reg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.d)regAdd(+b.dataset.d);else if(b.dataset.a=='clr')regClr();else if(b.dataset.a=='cls')closeReg();else if(b.dataset.a=='ok')regOk()});
function pauseT(){if(st=='play'){st='pause';keys={};showOv()}else if(st=='pause'){st='play';$('ov').style.display='none'}}
function showOv(){
 const o=$('ov');o.style.display='flex';let h='';if(st!='pause'){closeReg();closeOrd()}
 if((st=='summary'||st=='over')&&S.day>best){best=S.day;try{localStorage.setItem('kopdesBest',best)}catch(e){}}
 o.className=st=='menu'?'mn':'';
 if(st=='menu')h='<div class="mn-box"><div class="mn-awn">'+'<i></i>'.repeat(12)+'</div><div class="mn-logo"><small>KOPERASI DESA</small><b>KOPDES<br>SIMULASI 3D</b><span>🏪 Jadi kasir terbaik di desa!</span></div><div class="mn-ico"><span>🍚</span><span>🛒</span><span>🥚</span><span>☕</span></div><p class="mn-tag">Hitung belanjaan pelanggan, masukkan uang ke kasir dengan pas, dan jaga reputasi gerai sebelum hari berakhir. Beli stok barang, isi rak, dan kembangkan toko dengan menambah rak!</p><button id="go" class="mn-go">▶ Mulai Bermain</button><div class="mn-row"><button class="mn-sec" data-t="how">📖 Cara Bermain</button><button class="mn-sec" data-t="ach">🏅 Pencapaian</button></div><div class="mn-pn" id="pn"></div><div class="mn-stat"><span>🏆 Rekor: '+(best?'hari '+best:'belum ada')+'</span><span>🏅 '+Object.keys(G.ach).length+'/'+ACH.length+' pencapaian</span><span>💯 '+G.served+' pelanggan terlayani</span></div></div>';
 else if(st=='pause')h='<h2>⏸ Jeda</h2><p>Hari '+S.day+' · sisa '+Math.ceil(S.t)+' dtk · Kas Rp'+rp(S.money)+'</p><button id="go">Lanjutkan</button>';
 else if(st=='summary'){const U=[['h','💳 Mesin EDC (+10% bayaran)',3,45000],['s','🛒 Troli Lincah (pelanggan belanja lebih cepat)',3,30000],['p','🤝 Ramah Tamah (+15% sabar)',3,50000],['k','🧾 Kasir Pembantu (NPC terima bayaran otomatis)',3,60000],['r','👟 Sepatu Lari (+12% kecepatan jalan)',3,35000]];
  h='<h2>📅 Hari '+S.day+' selesai</h2><p>Pendapatan hari ini: Rp'+rp(S.dayMoney)+'<br>Kas: Rp'+rp(S.money)+'<br>Terlayani: '+S.served+' · Pergi: '+S.lost+' · 🥷 Tertangkap: '+S.caught+'<br>Reputasi: '+Math.round(S.rep)+'<br>Peringkat: '+(S.stars?'⭐'.repeat(S.stars):'—')+(S.stars==3?' (bonus Rp10.000!)':'')+'<br>🎯 Target Rp'+rp(S.tg)+': '+(S.hit?'✅ Tercapai! Bonus Rp15.000 & ⭐+5':'❌ belum tercapai')+'</p><div id="up">'+shelfBtn()+U.map(([k,n,mx,c])=>{const l=S.u[k],cost=c*(l+1);return l>=mx?'<button class="ub" disabled>'+n+' · MAKS</button>':'<button class="ub" data-k="'+k+'" data-c="'+cost+'"'+(S.money<cost?' disabled':'')+'>'+n+' · Lv'+l+' · Rp'+rp(cost)+'</button>'}).join('')+'</div><div class="ordbox"><b>📦 Pesan Stok untuk Besok</b><div id="ordB">'+ordInner()+'</div></div><button id="go">Lanjut ke Hari '+(S.day+1)+'</button>'}
 else h='<h2>😞 Kopdes Tutup</h2><p>Reputasi habis. Kamu bertahan sampai hari '+S.day+' dengan total pendapatan Rp'+rp(S.money)+'.</p><button id="go">Main Lagi</button>';
 o.innerHTML=h;
 if(st=='menu'){const HOW='<b>📖 Cara Bermain</b>🚶 WASD / panah = jalan · Shift = lari (pakai ⚡)<br>🧾 Dekati pelanggan yang membawa 🧾, tekan E / Spasi / AKSI untuk membuka kasir<br>💳 Jumlahkan harga barang yang dibawa, lalu masukkan uang yang pas (pecahan Rp1.000–50.000) dan tekan Bayar. Salah hitung = reputasi -2<br>📦 Stok dibeli manual: pesan di 💻 komputer (pojok kiri atas) atau di layar ringkasan hari. Barang masuk gudang, lalu berdiri di depan rak & tekan AKSI untuk mengisi (maks 12/produk). Rak kosong = pelanggan kecewa<br>🧱 Beli upgrade Tambah Rak di ringkasan hari untuk membuka rak & produk baru<br>⏳ Selesaikan sebelum kesabaran (bar) habis, reputasi 0 = tutup<br>🥷 Maling muncul mulai hari ke-3: kejar & tekan AKSI<br>🔥 Kombo beruntun, 👑 VIP bayar 2x, 🎯 capai target harian untuk bonus<br>⏱️💰❤️⚡ Ambil bonus di lantai · P = jeda',ACHH='<b>🏅 Pencapaian '+Object.keys(G.ach).length+'/'+ACH.length+'</b>'+ACH.map(([n],i)=>(G.ach[i]?'✅ ':'⬜ ')+n).join('<br>');let cur='';
  o.querySelectorAll('.mn-sec').forEach(b=>b.onclick=()=>{const t=b.dataset.t;cur=cur==t?'':t;$('pn').innerHTML=cur=='how'?HOW:cur=='ach'?ACHH:'';o.querySelectorAll('.mn-sec').forEach(x=>x.classList.toggle('on',x.dataset.t==cur))})}o.querySelectorAll('.ub[data-k]').forEach(b=>b.onclick=()=>{S.money-=+b.dataset.c;S.u[b.dataset.k]++;SFX.ok();rer()});o.querySelectorAll('.ub[data-sh]').forEach(b=>b.onclick=()=>{S.money-=+b.dataset.c;S.shelves++;const nx=ITEMS[S.shelves-1];S.stock[nx.k]=0;SFX.ok();say('🧱 Rak baru: '+nx.e+' '+nx.k+'! Pesan stoknya dulu.');chk();rer()});
 $('go').onclick=()=>{ac();MUS.on();
  if(st=='pause'){st='play';o.style.display='none';return}
  if(st=='menu'||st=='over')reset();
  else{clearC();S.day++;S.t=60;S.dayMoney=0;S.served=0;S.lost=0;S.caught=0;S.cs=[];S.pops=[];S.pk=[];S.pkT=10;S.stam=1;S.tired=false;S.spawn=4;S.rsv={};S.evd=pick(EV);S.tg=target(S.day);setCarry(null);say(S.evd.e+' '+S.evd.n+'! '+S.evd.d)}
  st='play';o.style.display='none'};
}
/* input */
const map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
 if(S&&S.ord&&st=='play'){if(['Escape','Enter','NumpadEnter','KeyE','Space','KeyP'].includes(e.code)&&!e.repeat)closeOrd();if(!e.code.startsWith('Shift'))e.preventDefault();return}
 if(S&&S.reg&&st=='play'){const c=e.code;if(e.repeat){e.preventDefault();return}
  if(/^(Digit|Numpad)[1-6]$/.test(c))regAdd(DEN[+c.slice(-1)-1]);else if(c=='Enter'||c=='NumpadEnter')regOk();else if(c=='Backspace')regClr();else if(c=='Escape')closeReg();
  if(!c.startsWith('Shift'))e.preventDefault();return}
 if(e.code=='ShiftLeft'||e.code=='ShiftRight'){keys.run=true}
 else if(map[e.code]){keys[map[e.code]]=true;e.preventDefault()}
 else if((e.code=='KeyP'||e.code=='Escape')&&!e.repeat){pauseT()}
 else if((e.code=='KeyE'||e.code=='Space')&&!e.repeat){e.preventDefault();act()}});
addEventListener('keyup',e=>{if(e.code=='ShiftLeft'||e.code=='ShiftRight')keys.run=false;else if(map[e.code])keys[map[e.code]]=false});
addEventListener('blur',()=>{keys={}});
addEventListener('keydown',e=>{if(e.code=='Enter'&&!e.repeat&&(st=='menu'||st=='over')){const g=$('go');if(g)g.click()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st=='play')pauseT()});
$('pb').onclick=e=>{pauseT();e.currentTarget.blur()};
document.querySelectorAll('#dp button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
{const rb=$('run');rb.addEventListener('pointerdown',e=>{e.preventDefault();keys.run=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>rb.addEventListener(ev,()=>keys.run=false))}
$('act').addEventListener('pointerdown',e=>{e.preventDefault();act()});
/* render */
let Q=2;try{const q=localStorage.getItem('kopdesQ');if(q!=null)Q=clamp(+q||0,0,3)}catch(e){}
const PR=()=>{const d=devicePixelRatio||1;return[Math.min(1,d),Math.min(1.5,d),Math.min(2,d),Math.min(3,Math.max(2,d))][Q]};
function setQ(i){Q=i;try{localStorage.setItem('kopdesQ',Q)}catch(e){}$('gq').textContent='🖼️ '+['Rendah','Sedang','Tinggi','Ultra'][Q];const ms=Math.min([1024,2048,4096,4096][Q],R.capabilities.maxTextureSize);if(dl.shadow.map){dl.shadow.map.dispose();dl.shadow.map=null}dl.shadow.mapSize.set(ms,ms);resize()}
$('gq').onclick=e=>{setQ((Q+1)%4);e.currentTarget.blur()};
let asp=1.6;
function resize(){const W=$('wrap'),w=W.clientWidth||innerWidth,h=W.clientHeight||innerHeight;R.setPixelRatio(PR());R.setSize(w,h,false);asp=w/h;cam.aspect=asp;cam.updateProjectionMatrix()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));if(window.ResizeObserver)new ResizeObserver(resize).observe($('wrap'));
function loop(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(st=='play'&&!S.ord)update(dt);syncShelves();
 const f=Math.max(1,1.7/asp)*1.45,cx=-4+(S.p.x+4)*.55,cz=(S.p.z-2)*.5;
 cam.position.set(cx,15*f,15*f+cz);cam.lookAt(cx,0,1.8*f+cz);
 /* siang -> senja */
 const pg=(st=='play'||st=='pause')?clamp(1-S.t/60,0,1):(st=='summary'?1:0),k=clamp((pg-.55)/.45,0,1);
 sc.background.setHex(S.evd.sk).lerp(DUSK,k*.6);hemi.intensity=.8-.25*k;dl.intensity=.6-.25*k;wl2.intensity=.35+.4*k;HAL.forEach(m=>m.opacity=.25+.55*k);
 $('msg').textContent=S.msgT>0?S.msg:(st=='play'?'Ayo layani pelanggan!':'');
 $('hv').textContent=invTot();{const em=ITEMS.slice(0,S.shelves).filter(i=>!S.stock[i.k]).map(i=>i.e).join('');$('hw').textContent=em?'⚠️ Habis '+em:''}$('hd').textContent=S.day;$('hc').textContent=S.combo;$('hg').textContent='🎯 Rp'+rp(S.dayMoney)+' / '+rp(S.tg);$('he').textContent=S.evd.e+' '+S.evd.n;$('ht').textContent=Math.ceil(S.t);$('hm').textContent=rp(S.money);$('hr').textContent=Math.round(S.rep);$('repfill').style.width=S.rep+'%';
 $('stfill').style.width=(S.stam*100)+'%';$('stfill').style.background=S.tired?'#c0392b':'#f5a623';
 R.render(sc,cam);requestAnimationFrame(loop);
}
reset();setQ(Q);showOv();requestAnimationFrame(loop);
</script>
