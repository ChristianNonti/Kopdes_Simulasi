<style>

#run{width:80px;height:46px;border-radius:23px;background:#e0912c;color:#fff;border:0;font-size:15px;font-weight:700;touch-action:none}

/* gabungkan mesh statis per warna (draw call turun drastis), lalu bekukan matriks objek statis */
 function catArr(a,C){const out=new C(a.reduce((q,x)=>q+x.length,0));let o=0;a.forEach(x=>{out.set(x,o);o+=x.length});return out}
 function mergeInto(root,skip){
  const inv=new T.Matrix4().copy(root.matrixWorld).invert(),G=new Map(),dead=[];
  (function walk(o){
   if(skip.has(o))return;
   const m=o.material;
   if(o.isMesh&&!o.children.length&&o.visible&&m&&m.isMeshLambertMaterial&&!m.vertexColors&&!m.map&&!m.transparent&&o.geometry.index&&o.geometry.attributes.uv){
    const k=0;let g=G.get(k);if(!g){g={p:[],n:[],u:[],i:[],cl:[],c:0};G.set(k,g)}
    const geo=o.geometry.clone().applyMatrix4(inv.clone().multiply(o.matrixWorld)),ix=geo.index.array,ox=new Uint32Array(ix.length);
    for(let i=0;i<ix.length;i++)ox[i]=ix[i]+g.c;
    const nv=geo.attributes.position.count,cc=new Float32Array(nv*3);for(let i=0;i<nv;i++){cc[i*3]=m.color.r;cc[i*3+1]=m.color.g;cc[i*3+2]=m.color.b}g.cl.push(cc);
    g.p.push(geo.attributes.position.array);g.n.push(geo.attributes.normal.array);g.u.push(geo.attributes.uv.array);g.i.push(ox);g.c+=geo.attributes.position.count;
    dead.push(o);return}
   o.children.slice().forEach(walk)})(root);
  dead.forEach(o=>{o.parent.remove(o);o.geometry.dispose();o.material.dispose()});
  G.forEach((g,k)=>{const geo=new T.BufferGeometry();
   geo.setAttribute('position',new T.BufferAttribute(catArr(g.p,Float32Array),3));
   geo.setAttribute('normal',new T.BufferAttribute(catArr(g.n,Float32Array),3));
   geo.setAttribute('uv',new T.BufferAttribute(catArr(g.u,Float32Array),2));
   geo.setAttribute('color',new T.BufferAttribute(catArr(g.cl,Float32Array),3));
   geo.setIndex(new T.BufferAttribute(catArr(g.i,Uint32Array),1));
   const mm=sh(new T.Mesh(geo,new T.MeshLambertMaterial({vertexColors:true})));mm.matrixAutoUpdate=false;root.add(mm)})}
